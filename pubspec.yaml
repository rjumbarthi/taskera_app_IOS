name: taskera_app
description: "TaskEra — Execution OS for high performers"
publish_to: 'none'

# Play Store release. Format: semantic+versionCode.
# Bump the +N (versionCode) on EVERY upload — Play rejects a build whose
# versionCode it has already seen. versionName (1.0.0) can stay across builds.
version: 1.0.1+16

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  flutter_svg: ^2.0.10
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  window_manager: ^0.4.0

  # ── Notifications ──────────────────────────────────────────────────────────
  flutter_local_notifications: ^18.0.0  # local scheduled push (Android/iOS/Windows)
  timezone: ^0.9.4                       # IANA tz DB for zonedSchedule

  # ── Real backend ───────────────────────────────────────────────────────────
  supabase_flutter: ^2.5.0          # auth + cloud db + edge functions
  google_sign_in: ^6.2.1            # Google OAuth (Android / iOS)
  googleapis: ^13.2.0               # Google Calendar + Gmail REST APIs
  http: ^1.2.0                      # HTTP client for Microsoft Graph + googleapis
  flutter_secure_storage: ^9.2.2    # encrypted token storage
  flutter_web_auth_2: ^4.0.0        # OAuth2 PKCE browser flow (Microsoft, all platforms)
  url_launcher: ^6.3.0              # required by flutter_web_auth_2 on Windows; also opens the Razorpay UPI link
  in_app_purchase: ^3.2.0           # Play Store / App Store subscriptions (UPI shows inside Play checkout in India)
  in_app_purchase_storekit: ^0.4.9  # direct dep for AppStoreProductDetails.skProduct (real intro-offer detection)
  in_app_purchase_android: ^0.5.0   # direct dep for GooglePlayProductDetails.subscriptionOfferDetails
  crypto: ^3.0.3                    # SHA-256 for PKCE code challenge + Apple nonce
  sign_in_with_apple: ^6.1.0        # Sign in with Apple (App Store Guideline 4.8)
  home_widget: ^0.6.0              # home-screen / lock-screen DTN widget (Android + iOS)
  google_mobile_ads: ^9.0.0        # AdMob — interstitial + rewarded ads for free-plan users (Android/iOS only)
  app_tracking_transparency: ^2.0.6+1  # iOS ATT prompt (Guideline 5.1.1) — must precede ad SDK init

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.0
  image: ^4.2.0                     # tooling: generate the round app-icon source

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  # TaskEra Glass icon: a square, fully-opaque source with the rounded-square
  # shape and glass finish already baked in (not a flat mark needing the old
  # circle-crop treatment) — each OS applies its own mask on top of it.
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  image_path: "assets/logo/taskera_icon_glass.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/taskera_icon_glass.png"
  min_sdk_android: 28
  web:
    generate: false
  windows:
    generate: true
    image_path: "assets/logo/taskera_logo_round.png"
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/wallpapers/
    - assets/logo/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: Caveat Brush
      fonts:
        - asset: assets/fonts/CaveatBrush-Regular.ttf
    - family: Finger Paint
      fonts:
        - asset: assets/fonts/FingerPaint-Regular.ttf
